workflows:
  android-apk:
    name: Free Mesh APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | $SDKMANAGER --licenses > /dev/null || true
          $SDKMANAGER "platforms;android-34" "build-tools;34.0.0"
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip
          ./gradle-8.7/bin/gradle assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
